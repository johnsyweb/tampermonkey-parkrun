[tools]
node = "24"
aube = "1.41.0"
ruby = "4.0.7"

[tasks.bootstrap]
description = "Install mise tools and a frozen dependency tree (aube ci), plus docs gems"
run = "mise install && aube ci && aube run docs:install"

[tasks.setup]
description = "Prepare a fresh local checkout"
depends = ["bootstrap"]
run = "aube run build:scripts"

[tasks.update]
description = "Refresh tools and dependencies after git pull"
run = "mise install && aube install && aube run docs:install && aube run build:scripts && aube run update-scripts-data"

[tasks.update-deps]
description = "Show outdated packages and bump within package.json ranges (aube update)"
run = "aube outdated || true; aube update"

[tasks.build]
description = "Build userscripts and microsite"
run = "aube run docs:build"

[tasks.server]
description = "Serve microsite locally"
run = "aube run docs:serve"

[tasks.test]
description = "Run lint and tests"
run = "aube run lint && aube test"

[tasks.docs]
description = "Build microsite only"
run = "aube run docs:build"

[tasks.docs-check]
description = "Run microsite link checks"
run = "aube run docs:check"

[tasks.screenshots]
description = "Generate microsite screenshots"
run = "aube run screenshots"

[tasks.preview]
description = "Preview a userscript in the browser"
run = "aube run preview"

[tasks.cibuild]
description = "Run full local CI build (frozen install, audit, package ci script)"
run = "./script/cibuild"
