name: Dependabot auto-merge

# Merge only after CI/CD succeeds. Do not enable auto-merge on PR open —
# main has no required checks, so --auto would merge while CI is still red.
on:
  workflow_run:
    workflows:
      - CI/CD
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Find open Dependabot pull request for this CI run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.state == "open")] | first // empty')
          if [ -z "$pr_json" ]; then
            echo "No open pull request for ${HEAD_SHA}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_number=$(jq -r '.number' <<<"$pr_json")
          author=$(jq -r '.user.login' <<<"$pr_json")
          if [ "$author" != "dependabot[bot]" ]; then
            echo "PR #${pr_number} author is ${author}, not Dependabot"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Merge Dependabot pull request
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          echo "Merging Dependabot PR #${PR_NUMBER} after successful CI"
          gh pr merge "$PR_NUMBER" --merge --delete-branch
