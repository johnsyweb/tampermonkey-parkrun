name: aube-lock

# Regenerates aube-lock.yaml on Renovate branches, runs merge-gate scripts, and
# publishes Check Runs on the final HEAD (no GitHub App). See
# johnsyweb/renovate-config and ADR 0002.

on:
  push:
    branches: ['renovate/**']

permissions:
  contents: write
  checks: write

jobs:
  aube-lock:
    uses: johnsyweb/renovate-config/.github/workflows/aube-lock.yml@be52d1fcfaca9e337fd461f7767f519957d6f629
    with:
      verify_command: ./script/cibuild
      check_name: renovate-verify
