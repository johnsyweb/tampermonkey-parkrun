name: aube-lock

# Regenerates aube-lock.yaml on Renovate branches, runs merge-gate scripts, and
# publishes Check Runs on the final HEAD (no GitHub App). See
# johnsyweb/renovate-config and ADR 0002.

on:
  push:
    branches: ['renovate/**']

permissions:
  contents: write
  checks: write

jobs:
  aube-lock:
    uses: johnsyweb/renovate-config/.github/workflows/aube-lock.yml@eb631b28e2a536f1ccd3db064790afb2a06c8782
    with:
      verify_command: ./script/cibuild
      check_name: renovate-verify
      # Required CI job name — when aube-lock fails this goes red so merges cannot ignore it.
      status_check_names: |
        build-and-test
